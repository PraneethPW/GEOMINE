name: Production health
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/production-health.yml']
permissions:
  contents: read
concurrency:
  group: production-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the live API, database readiness, and worker
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, time, urllib.request
          origin = 'https://geomine-api-production.up.railway.app'
          def check(path):
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(origin + path, headers={'User-Agent': 'GeoMine-Production-Health/1.0'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = json.load(response)
                          if response.status != 200 or not isinstance(payload, dict):
                              raise ValueError('Invalid health response')
                      print(path + ': healthy', flush=True)
                      return
                  except Exception as error:
                      if attempt == 2:
                          raise RuntimeError(path + ': unavailable after three checks (' + type(error).__name__ + ')') from None
                      time.sleep(20)
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as executor:
              list(executor.map(check, ['/api/ready', '/api/health/worker']))
          PY
